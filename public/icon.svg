<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="50%" stop-color="#0c0d13"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8214"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#d4af37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8"/>

  <!-- Inner Gold Decorative Frame -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>

  <!-- Centered Luxury S Logo -->
  <text x="256" y="328" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="240" 
        font-weight="bold" 
        font-style="italic"
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)">
    S
  </text>
  
  <!-- Subtitle SAVORIA -->
  <text x="256" y="396" 
        font-family="sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="10" 
        text-anchor="middle" 
        fill="#e5c568" 
        opacity="0.95">
    SAVORIA
  </text>
</svg>
